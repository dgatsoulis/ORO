; ============================================================================
; ORO - aurora for Earth
; ----------------------------------------------------------------------------
; THE REFERENCE. Green oxygen body (96-193 km), violet-pink nitrogen lower
; border (below ~96 km), red oxygen top (above ~240 km) - three different
; species at three altitudes, which is why ORO uses three colours.
; The magnetic pole really does sit ~11 deg off the spin axis: that is
; AuroraTiltX below, not an artistic liberty. Reach 1.0 pushes the oval to
; ~40 deg latitude - a severe storm, low enough to see from the ISS.
;
; ORO owns this file (not Orbiter's Earth.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 60
AuroraBaseMaxKm = 140
AuroraTopMinKm = 200
AuroraTopMaxKm = 450

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 12
AuroraColatMax = 50

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 11
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 11492040   ; violet-pink N2 lower border
AuroraColBody = 6938940   ; 557.7 nm oxygen green
AuroraColTop = 3620045   ; 630 nm oxygen red

; --- the look ---
AuroraActivity = 0.55
AuroraReach = 0.26
AuroraFold = 0.5
AuroraRays = 0.6
AuroraBreakup = 0.4
AuroraThick = 0.3
AuroraBase = 0.46
AuroraHeight = 0.5
AuroraRibbons = 2

