; ============================================================================
; ORO - aurora for Uranus
; ----------------------------------------------------------------------------
; THE SHOWCASE FOR TILT. Uranus' magnetic axis is thrown ~59 deg off its
; rotation axis (and offset from the planet's centre), so its aurorae do not
; ring the poles at all - they wander in a way nothing else in the solar
; system does. Weak, complex, and still not fully understood. Hydrogen, so
; the palette is a pale red with blue-violet edges.
;
; ORO owns this file (not Orbiter's Uranus.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 200
AuroraBaseMaxKm = 800
AuroraTopMinKm = 1000
AuroraTopMaxKm = 2500

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 10
AuroraColatMax = 25

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 59
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15439480   ; blue hydrogen edge
AuroraColBody = 8548055   ; pale hydrogen red
AuroraColTop = 14776470   ; violet upper

; --- the look ---
AuroraActivity = 0.3
AuroraReach = 0.4
AuroraFold = 0.6
AuroraRays = 0.5
AuroraBreakup = 0.5
AuroraThick = 0.25
AuroraBase = 0.45
AuroraHeight = 0.5
AuroraRibbons = 2

