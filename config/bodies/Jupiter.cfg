; ============================================================================
; ORO - aurora for Jupiter
; ----------------------------------------------------------------------------
; The most powerful aurora in the solar system - up to 1000x Earth's, and
; permanent, since it is driven by Jupiter's own rotation and Io's plasma
; torus rather than by the solar wind. Hydrogen, not oxygen: NO GREEN. Most
; of it is ultraviolet; what the eye would catch is H-alpha red with violet
; and blue at the edges. The oval is tighter than Earth's and barely moves.
;
; ORO owns this file (not Orbiter's Jupiter.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 200
AuroraBaseMaxKm = 700
AuroraTopMinKm = 900
AuroraTopMaxKm = 3000

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 8
AuroraColatMax = 20

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 10
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 16745070   ; blue hydrogen edge
AuroraColBody = 4612095   ; H-alpha red - the visible body
AuroraColTop = 15099080   ; violet upper

; --- the look ---
AuroraActivity = 1
AuroraReach = 0.3
AuroraFold = 0.45
AuroraRays = 0.7
AuroraBreakup = 0.3
AuroraThick = 0.5
AuroraBase = 0.4
AuroraHeight = 0.6
AuroraRibbons = 3

