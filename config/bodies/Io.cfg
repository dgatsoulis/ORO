; ============================================================================
; ORO - aurora for Io
; ----------------------------------------------------------------------------
; THE RAINBOW, AND IT IS EQUATORIAL. Io has no magnetic field of its own -
; its aurora is driven by Jupiter's, so it glows near the EQUATOR rather
; than the poles. That is what AuroraTiltX = 90 does: it swings the oval
; centre all the way onto the equator. Volcanic chemistry gives it the most
; colourful aurora in the solar system - blue sulphur dioxide low, oxygen
; green through the body, sodium orange-yellow above.
;
; ORO owns this file (not Orbiter's Io.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 20
AuroraBaseMaxKm = 80
AuroraTopMinKm = 100
AuroraTopMaxKm = 300

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 15
AuroraColatMax = 35

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 90
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 16755290   ; blue sulphur dioxide
AuroraColBody = 7923320   ; oxygen green
AuroraColTop = 3970815   ; sodium orange-yellow

; --- the look ---
AuroraActivity = 0.7
AuroraReach = 0.4
AuroraFold = 0.5
AuroraRays = 0.6
AuroraBreakup = 0.5
AuroraThick = 0.35
AuroraBase = 0.4
AuroraHeight = 0.5
AuroraRibbons = 2

