; ============================================================================
; ORO - aurora for Triton
; ----------------------------------------------------------------------------
; Neptune's big moon keeps a very thin nitrogen atmosphere - enough for a
; faint blue glow, and nothing more. Shipped deliberately dim.
;
; ORO owns this file (not Orbiter's Triton.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 20
AuroraBaseMaxKm = 80
AuroraTopMinKm = 100
AuroraTopMaxKm = 250

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 20
AuroraColatMax = 45

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 0
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 14780275   ; nitrogen blue
AuroraColBody = 14794390   ; pale cyan body
AuroraColTop = 14124975   ; violet upper

; --- the look ---
AuroraActivity = 0.12
AuroraReach = 0.5
AuroraFold = 0.6
AuroraRays = 0.4
AuroraBreakup = 0.65
AuroraThick = 0.2
AuroraBase = 0.5
AuroraHeight = 0.45
AuroraRibbons = 1

