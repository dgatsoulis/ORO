; ============================================================================
; ORO - aurora for Neptune
; ----------------------------------------------------------------------------
; The other tilted ice giant - ~47 deg between the magnetic and rotation
; axes, so like Uranus its aurorae sit well away from the geographic poles.
; Faint and patchy; the high Breakup is the honest reading of "complex and
; still somewhat mysterious to scientists".
;
; ORO owns this file (not Orbiter's Neptune.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 200
AuroraBaseMaxKm = 800
AuroraTopMinKm = 1000
AuroraTopMaxKm = 2400

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 10
AuroraColatMax = 25

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 47
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15436905   ; blue hydrogen edge
AuroraColBody = 9202125   ; pale hydrogen red
AuroraColTop = 15102865   ; violet upper

; --- the look ---
AuroraActivity = 0.25
AuroraReach = 0.4
AuroraFold = 0.6
AuroraRays = 0.5
AuroraBreakup = 0.55
AuroraThick = 0.25
AuroraBase = 0.45
AuroraHeight = 0.5
AuroraRibbons = 2

