; ============================================================================
; ORO - aurora for Ganymede
; ----------------------------------------------------------------------------
; THE ONLY MOON IN THE SOLAR SYSTEM WITH ITS OWN MAGNETIC FIELD - so unlike
; every other moon here, Ganymede has genuine polar ovals. Watching them
; rock is how Hubble established that it hides a subsurface ocean: a salty
; conducting layer damps the wobble. Oxygen glow, so green with blue below.
; Orbiter gives Ganymede no atmosphere, so this file is the only reason it
; glows at all - ORO treats a shipped config as the statement that it does.
;
; ORO owns this file (not Orbiter's Ganymede.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 20
AuroraBaseMaxKm = 100
AuroraTopMinKm = 150
AuroraTopMaxKm = 400

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 25
AuroraColatMax = 45

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 4
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15769710   ; blue lower
AuroraColBody = 10540920   ; oxygen green body
AuroraColTop = 13138090   ; violet-red upper

; --- the look ---
AuroraActivity = 0.35
AuroraReach = 0.4
AuroraFold = 0.5
AuroraRays = 0.55
AuroraBreakup = 0.45
AuroraThick = 0.3
AuroraBase = 0.4
AuroraHeight = 0.5
AuroraRibbons = 2

