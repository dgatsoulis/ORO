; ============================================================================
; ORO - aurora for Europa
; ----------------------------------------------------------------------------
; Europa's oxygen glow is part of how we know it has a vast subsurface
; ocean. It has no field of its own - Jupiter's drives it - so the glow is
; diffuse and global rather than a tight oval: wide colatitude, high
; Breakup. Like Ganymede, Orbiter gives it no atmosphere, so this file is
; what makes it glow.
;
; ORO owns this file (not Orbiter's Europa.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 20
AuroraBaseMaxKm = 80
AuroraTopMinKm = 100
AuroraTopMaxKm = 300

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 30
AuroraColatMax = 70

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 0
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15772280   ; blue lower
AuroraColBody = 9886850   ; oxygen green body
AuroraColTop = 7237320   ; oxygen red upper

; --- the look ---
AuroraActivity = 0.25
AuroraReach = 0.45
AuroraFold = 0.65
AuroraRays = 0.4
AuroraBreakup = 0.6
AuroraThick = 0.25
AuroraBase = 0.45
AuroraHeight = 0.5
AuroraRibbons = 1

