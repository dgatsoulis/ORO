; ============================================================================
; ORO - aurora for Mars
; ----------------------------------------------------------------------------
; Mars has at least four kinds of aurora despite having NO global magnetic
; field - the discrete ones hang over the crustal magnetic fields of the
; southern highlands rather than over a pole. That is what the large tilt
; and the high Breakup are saying: patchy, off-axis, and very faint. The
; green is real - ExoMars TGO detected the 557.7 nm oxygen line there.
;
; ORO owns this file (not Orbiter's Mars.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 60
AuroraBaseMaxKm = 140
AuroraTopMinKm = 180
AuroraTopMaxKm = 320

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 25
AuroraColatMax = 60

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = -40
AuroraTiltY = 25

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 14448790   ; faint violet
AuroraColBody = 8572270   ; 557.7 nm oxygen green, dim
AuroraColTop = 6581930   ; dim red upper

; --- the look ---
AuroraActivity = 0.18
AuroraReach = 0.5
AuroraFold = 0.65
AuroraRays = 0.4
AuroraBreakup = 0.75
AuroraThick = 0.2
AuroraBase = 0.5
AuroraHeight = 0.45
AuroraRibbons = 2

