; ============================================================================
; ORO - aurora for Saturn
; ----------------------------------------------------------------------------
; A pink glow with purple streaks, and unusually tall - Cassini measured
; curtains over 1000 km high, hence the generous Top range. Hydrogen again,
; so no green. Saturn is the solar system's oddity: its magnetic axis is
; aligned with its rotation axis to under a degree, which is why both tilts
; below are ZERO - the one world where the ovals really do ring the poles.
;
; ORO owns this file (not Orbiter's Saturn.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 300
AuroraBaseMaxKm = 1000
AuroraTopMinKm = 1400
AuroraTopMaxKm = 4000

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 10
AuroraColatMax = 26

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 0
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15101630   ; purple lower
AuroraColBody = 10844400   ; hydrogen pink - the body
AuroraColTop = 14772645   ; purple streaks above

; --- the look ---
AuroraActivity = 0.8
AuroraReach = 0.35
AuroraFold = 0.55
AuroraRays = 0.65
AuroraBreakup = 0.3
AuroraThick = 0.4
AuroraBase = 0.4
AuroraHeight = 0.55
AuroraRibbons = 2

