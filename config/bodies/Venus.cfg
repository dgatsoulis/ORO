; ============================================================================
; ORO - aurora for Venus
; ----------------------------------------------------------------------------
; Venus has no global magnetic field either - only weak, localised ones - so
; its aurorae are faint, diffuse and nothing like an oval. Hence the wide
; colatitude range, the very high Breakup and a single ribbon: this is a
; scattered green-and-blue glow, not a curtain.
;
; ORO owns this file (not Orbiter's Venus.cfg). ACTIVITY is the opt-in: set it
; to 0 and this world has no aurora. Min/Max pairs are the RANGES the dialog
; sliders span, so one 0..1 knob means the right thing at every world.
; Colours are COLORREF decimals by ALTITUDE: Base = lower border, Body = main
; curtain, Top = diffuse upper glow. Edit here or tune in ATMOS and press SAVE.
; ============================================================================

; --- altitude bands [km] ---
AuroraBaseMinKm = 90
AuroraBaseMaxKm = 160
AuroraTopMinKm = 200
AuroraTopMaxKm = 350

; --- oval size, COLATITUDE from the magnetic pole [deg] ---
AuroraColatMin = 20
AuroraColatMax = 55

; --- magnetic pole offset from the GEOGRAPHIC pole [deg] ---
AuroraTiltX = 0
AuroraTiltY = 0

; --- colours by altitude (COLORREF decimal) ---
AuroraColBase = 15442030   ; blue
AuroraColBody = 11522680   ; green-cyan, faint
AuroraColTop = 13801060   ; blue upper

; --- the look ---
AuroraActivity = 0.15
AuroraReach = 0.55
AuroraFold = 0.7
AuroraRays = 0.35
AuroraBreakup = 0.8
AuroraThick = 0.2
AuroraBase = 0.5
AuroraHeight = 0.45
AuroraRibbons = 1

